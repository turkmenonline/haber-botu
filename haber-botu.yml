name: Haber Botu

on:
  schedule:
    - cron: "*/30 * * * *"   # her 30 dakikada yeni haberleri tara
    - cron: "5 18 * * *"     # her gün 21:05 (Türkiye saati) günlük özet
  workflow_dispatch:
    inputs:
      mode:
        description: "check veya digest"
        default: "check"

permissions:
  contents: write

concurrency:
  group: haber-botu
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_CAR_TOPIC: ${{ secrets.NTFY_CAR_TOPIC }}
          NTFY_F1_TOPIC: ${{ secrets.NTFY_F1_TOPIC }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '5 18 * * *' && 'digest' || 'check') }}
        run: python news_bot.py "$MODE"

      - name: Durumu kaydet
        run: |
          git config user.name "haber-botu"
          git config user.email "haber-botu@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "veri güncellemesi" && git pull --rebase && git push)
