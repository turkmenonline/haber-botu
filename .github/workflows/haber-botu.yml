name: Haber Botu

on:
  schedule:
    # GitHub, tam saat/buçuk gibi yoğun dakikalarda çalışmaları atlayabiliyor.
    # Bu yüzden yoğun olmayan dakikalarda ve sık çalıştırıyoruz; atlanan olursa bir sonraki yakalar.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check veya digest"
        default: "check"

permissions:
  contents: write

concurrency:
  group: haber-botu
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_CAR_TOPIC: ${{ secrets.NTFY_CAR_TOPIC }}
          NTFY_F1_TOPIC: ${{ secrets.NTFY_F1_TOPIC }}
          MODE: ${{ github.event.inputs.mode || 'check' }}
        run: python news_bot.py "$MODE"

      - name: Durumu kaydet
        run: |
          git config user.name "haber-botu"
          git config user.email "haber-botu@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "veri güncellemesi" && git pull --rebase && git push)
